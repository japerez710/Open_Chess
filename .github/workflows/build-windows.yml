name: Crear instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar Open Chess para Windows
    runs-on: windows-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Crear aplicación Windows
        shell: powershell
        run: python -m PyInstaller --noconfirm --clean --windowed --name OpenChess --icon "assets\OpenChess.ico" --add-data "assets\openchess-icon-1024.png;assets" --collect-all customtkinter --collect-all reportlab --collect-all openpyxl --collect-all xlrd run.py

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Crear instalador
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\OpenChess.iss"'

      - name: Publicar instalador
        uses: actions/upload-artifact@v7
        with:
          name: OpenChess-Windows-Setup-0.9.0
          path: dist/installer/OpenChess-Setup-0.9.0.exe
          if-no-files-found: error
